name: collect and deploy

on:
  # 매체 80곳 수집에 걸리는 시간은 10초 안쪽이라 30분 주기를 유지한다.
  # 주기를 바꾸려면 이 줄만 고치면 된다 (예: 1시간은 "0 * * * *")
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      slack_test:
        description: "Slack 시험 알림 보내기"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

# 매체가 80곳으로 늘어 한 번의 실행이 길어졌으므로, 다음 수집이 배포 중인 작업을 죽이지 않도록 큐에 넣는다
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 직전에 배포된 기사 데이터를 가져와 이어서 누적합니다 (처음에는 없어도 괜찮습니다)
      - name: Fetch previous data
        run: curl -fsSL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/articles.json" -o public/data/articles.json || true
      # 키워드 순위의 날짜별 기록도 이어서 누적합니다
      - name: Fetch previous keyword history
        run: curl -fsSL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/keywords.json" -o public/data/keywords.json || true
      # 자동으로 쓴 정리 기사도 직전 배포본에서 이어 받습니다
      # 한 번 쓴 Unsplash 사진 기록도 이어서 받습니다(같은 사진을 다시 쓰지 않기 위해)
      - name: Fetch previous photo history
        run: curl -fsSL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/photos-used.json" -o public/data/photos-used.json || true
      - name: Fetch previous stories
        run: curl -fsSL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/stories.json" -o public/data/stories.prev.json || true
      - name: Collect articles
        run: node scripts/collect.mjs
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      # 정리 기사와 오늘의 AI 브리핑 자동 작성 (ANTHROPIC_API_KEY 시크릿이 없으면 건너뜀)
      - name: Write stories
        run: node scripts/write.mjs || echo "정리 기사 작성 단계 실패, 배포는 계속합니다"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Slack 운영 로그: 새로 공개된 정리 기사와 브리핑, 오전 9시대 하루 요약 (SLACK_WEBHOOK_URL 시크릿이 없으면 건너뜀)
      - name: Slack test
        if: ${{ github.event.inputs.slack_test == 'true' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          node scripts/slack.mjs --text ":wave: AI 뉴스웨이브 운영 로그 연결 시험입니다. 앞으로 새 정리 기사 공개, 오전 9시 하루 요약, 문제 경고가 이 채널로 옵니다."
      - name: Slack log
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node scripts/slack.mjs || true
      - name: Remove temp files
        run: rm -f public/data/stories.prev.json
      # 정리 기사마다 검색엔진용 정적 페이지와 sitemap.xml 생성
      - name: Build story pages
        run: node scripts/pages.mjs
      # 클라우드 예약 작업(정리 기사 작성)은 사이트 주소에 접속할 수 없어서, 최신 기사 데이터를 저장소의 data 브랜치에도 올려 둡니다.
      # 히스토리가 쌓이지 않도록 매번 커밋 하나짜리 브랜치로 덮어씁니다.
      - name: Publish data branch
        run: |
          mkdir -p /tmp/databranch && cp public/data/articles.json public/data/stories.json /tmp/databranch/
          cd /tmp/databranch
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "최신 기사 데이터 $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data:data || echo "data 브랜치 갱신 실패"
      # 운영 상태 점검: 문제가 있으면 이슈를 열어 메일로 알립니다(같은 제목의 열린 이슈가 있으면 댓글만 추가)
      - name: Health check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out=$(node scripts/health.mjs)
          if [ -n "$out" ]; then
            echo "$out"
            SLACK_WEBHOOK_URL="${{ secrets.SLACK_WEBHOOK_URL }}" node scripts/slack.mjs --warn "$out" || true
            title="운영 점검 경고"
            num=$(gh issue list -R "${{ github.repository }}" --state open --search "$title in:title" --json number -q '.[0].number')
            if [ -n "$num" ]; then gh issue comment "$num" -R "${{ github.repository }}" -b "$out" || true
            else gh issue create -R "${{ github.repository }}" -t "$title" -b "$out" || true; fi
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # 수집이나 빌드가 실패하면 이슈를 열어 메일로 알립니다
  notify-failure:
    needs: build
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="수집 실패"
          body="실행 기록: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          num=$(gh issue list -R "${{ github.repository }}" --state open --search "$title in:title" --json number -q '.[0].number')
          if [ -n "$num" ]; then gh issue comment "$num" -R "${{ github.repository }}" -b "$body"
          else gh issue create -R "${{ github.repository }}" -t "$title" -b "$body"; fi
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            curl -s -X POST -H 'content-type: application/json' -d "{\"text\":\":rotating_light: *수집 또는 배포 실패* $body\"}" "${{ secrets.SLACK_WEBHOOK_URL }}" || true
          fi
