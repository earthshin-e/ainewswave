name: collect and deploy

on:
  # 매체 81곳 수집에 걸리는 시간은 10초 안쪽이라 30분 주기를 유지한다.
  # 주기를 바꾸려면 이 줄만 고치면 된다 (예: 1시간은 "0 * * * *")
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# 매체가 81곳으로 늘어 한 번의 실행이 길어졌으므로, 다음 수집이 배포 중인 작업을 죽이지 않도록 큐에 넣는다
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 직전에 배포된 기사 데이터를 가져와 이어서 누적합니다 (처음에는 없어도 괜찮습니다)
      - name: Fetch previous data
        run: curl -fsSL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/articles.json" -o public/data/articles.json || true
      # 키워드 순위의 날짜별 기록도 이어서 누적합니다
      - name: Fetch previous keyword history
        run: curl -fsSL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/keywords.json" -o public/data/keywords.json || true
      # 자동으로 쓴 정리 기사도 직전 배포본에서 이어 받습니다
      - name: Fetch previous stories
        run: curl -fsSL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/stories.json" -o public/data/stories.prev.json || true
      - name: Collect articles
        run: node scripts/collect.mjs
      # 정리 기사와 오늘의 AI 브리핑 자동 작성 (ANTHROPIC_API_KEY 시크릿이 없으면 건너뜀)
      - name: Write stories
        run: node scripts/write.mjs || echo "정리 기사 작성 단계 실패, 배포는 계속합니다"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Remove temp files
        run: rm -f public/data/stories.prev.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
