name: diag rss
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: probe hosts
        run: |
          for u in https://rss.mt.co.kr/mt_news.xml https://rss.etnews.com/Section901.xml https://www.mt.co.kr; do
            echo "=== $u"
            curl -sS -o /dev/null -w "curl: %{http_code} %{time_total}s\n" --max-time 25 -A 'AIInsideBot/1.0' "$u" || echo "curl 실패 exit=$?"
          done
          node -e '
          const urls=["https://rss.mt.co.kr/mt_news.xml","https://rss.etnews.com/Section901.xml"];
          for (const u of urls) {
            try { const r = await fetch(u, {headers:{"user-agent":"AIInsideBot/1.0"}, signal: AbortSignal.timeout(25000)});
              console.log("node OK", u, r.status); }
            catch (e) { console.log("node FAIL", u, e.message, "| cause:", e.cause?.code || e.cause?.message || e.cause); }
          }'
